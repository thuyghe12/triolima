<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Triolima</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <!-- LEFT · chat -->
      <section class="chat">
        <header class="chat-head">
          <div class="brand">
            <span class="logo">△</span>
            <span class="name">Triolima</span>
            <span class="tagline">incident assistant</span>
          </div>
          <div class="conn" id="conn"><i></i><span id="conn-text">connecting</span></div>
        </header>

        <div class="stream" id="chat"></div>

        <div class="chips" id="chips"></div>
        <form class="composer" id="composer">
          <input id="input" autocomplete="off" placeholder="Investigate INC-7788 on payments-api." />
          <button type="submit" aria-label="Send">↵</button>
        </form>
      </section>

      <!-- RIGHT · trace / rubric -->
      <aside class="side" id="side">
        <header class="side-head">
          <div class="tabs" id="tabs">
            <button data-tab="trace" class="on">Trace</button>
            <button data-tab="rubric">Rubric</button>
          </div>
          <button class="hide" id="hide" title="Collapse">⟩</button>
        </header>

        <div class="legend" id="legend"></div>

        <div class="panel" id="panel-trace">
          <div class="trace" id="trace"></div>
          <p class="empty" id="trace-empty">Every hop, classified live by the mechanism that handled it.</p>
        </div>

        <div class="panel" id="panel-rubric" hidden>
          <p class="lead">The policy, and you own it. Each signal is routed to the cheapest mechanism that can be trusted with it.</p>
          <div class="rubric" id="rubric"></div>
        </div>

        <footer class="stat" id="stat"></footer>
      </aside>

      <button class="reopen" id="reopen" title="Show trace">Trace ⟨</button>
    </div>

    <div class="overlay" id="overlay" hidden>
      <div class="card">
        <div class="card-tier"><i></i><span>human · non-negotiable</span></div>
        <p class="card-says" id="card-says"></p>
        <p class="card-meta" id="card-meta"></p>
        <input id="card-correct" placeholder="what to do instead…" hidden />
        <div class="card-actions">
          <button data-answer="keep_going" class="ok">Keep going</button>
          <button data-answer="pause" class="warn">Pause</button>
          <button data-answer="correct" class="alt">Correct</button>
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
